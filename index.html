<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Estamos em Construção🚀</title>
  </head>
  <body class="bg-slate-900 flex items-center justify-center min-h-screen p-6">
    <div class="max-w-2xl text-center">
      <div class="mb-8 flex justify-center">
        <div class="max-w-xl w-full text-center z-10">
          <div class="flex justify-center mb-8">
            <div class="relative group">
              <div
                class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-blue-600 rounded-full blur opacity-25 group-hover:opacity-50 transition duration-1000"
              ></div>

              <img
                src="./assets/favicon.svg"
                alt="Logo da Empresa"
                class="relative h-24 w-24 md:h-32 md:w-32 object-contain rounded-2xl bg-slate-800 p-2 border border-slate-700"
              />
            </div>
          </div>
        </div>
      </div>

      <h1 class="text-4xl md:text-6xl font-bold text-white mb-4 tracking-tight">
        Site em construção🚧
      </h1>
      <p class="text-slate-400 text-lg md:text-xl mb-10 leading-relaxed">
        Estamos trabalhando duro para trazer uma experiência digital incrível.
        <br />
        <br />
        <span class="font-bold"
          >Volte em breve para conferir as novidades.</span
        >
      </p>

      <div class="w-full bg-slate-800 rounded-full h-2.5 mb-12">
        <div class="bg-indigo-500 h-2.5 rounded-full" style="width: 75%"></div>
        <p class="text-xs text-slate-500 mt-2 text-right">Progresso: 75%</p>
      </div>

      <div class="flex justify-center space-x-6 text-slate-400">
        <a
          href="https://www.linkedin.com/in/jonathanduartecosta/"
          target="_blank"
          class="hover:text-white transition-colors"
          >LinkedIn</a
        >
        <a
          href="https://github.com/jonathandcosta"
          target="_blank"
          class="hover:text-white transition-colors"
          >GitHub</a
        >
        <a
          href="mailto:jddatsoc@gmail.com"
          class="hover:text-white transition-colors"
          >E-mail</a
        >
      </div>
    </div>
  </body>
</html>
